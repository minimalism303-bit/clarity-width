name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target ClarityWidth_VST3 --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ClarityWidth-Windows-VST3
          path: build/ClarityWidth_artefacts/Release/VST3/ClarityWidth.vst3

  build-macos:
    name: macOS VST3 + AU
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --target ClarityWidth_VST3 --config Release

      - name: Build AU
        run: cmake --build build --target ClarityWidth_AU --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ClarityWidth-macOS-VST3
          path: build/ClarityWidth_artefacts/Release/VST3/ClarityWidth.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: ClarityWidth-macOS-AU
          path: build/ClarityWidth_artefacts/Release/AU/ClarityWidth.component

  build-linux:
    name: Linux VST3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev pkg-config

      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target ClarityWidth_VST3 -j$(nproc)

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ClarityWidth-Linux-VST3
          path: build/ClarityWidth_artefacts/Release/VST3/ClarityWidth.vst3
